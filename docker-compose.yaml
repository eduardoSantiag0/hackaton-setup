
services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Sao_Paulo
    volumes:
      - type: bind
        source: ./admin/wg0.config
        target: /config/wg_confs/wg0.conf
        bind:
          create_host_path: false
    ports:
      - "51820:51820/udp" # unica porta que precisa estar aberta no firewall da VM
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    networks:
      hackaton-network:
        ipv4_address: 172.28.10.2

  grupo1:
    image: ubuntu:24.04 # PREENCHER: imagem/app do grupo
    container_name: grupo1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.5" # PREENCHER
          memory: "2g" # PREENCHER
    networks:
      hackaton-network:
        ipv4_address: 172.28.10.11


  grupo2:
      image: ubuntu:24.04 #TODO PREENCHER
      container_name: grupo2
      restart: unless-stopped
      deploy:
          resources:
              limits:
                  cpus: "1.5" #TODO PREENCHER
                  memory: "2g" #TODO PREENCHER
      networks:
          hackaton-network:
              ipv4_address: 172.28.10.12


networks:
  hackaton-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
